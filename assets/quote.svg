<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100" width="800" height="100">
  <defs>
    <linearGradient id="bgQ" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d0d0d;stop-opacity:0"/>
      <stop offset="20%" style="stop-color:#0d0d0d;stop-opacity:1"/>
      <stop offset="80%" style="stop-color:#0d0d0d;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d0d0d;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="borderQ" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e00000;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#e00000;stop-opacity:0.8"/>
      <stop offset="70%" style="stop-color:#e00000;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#e00000;stop-opacity:0"/>
    </linearGradient>
  </defs>

  <rect width="800" height="100" fill="url(#bgQ)" rx="8"/>
  <rect x="0" y="0" width="800" height="1" fill="url(#borderQ)"/>
  <rect x="0" y="99" width="800" height="1" fill="url(#borderQ)"/>

  <!-- Quote marks -->
  <text x="80" y="60" font-family="Georgia, serif" font-size="64" fill="#e00000" opacity="0.25" text-anchor="middle">"</text>
  <text x="720" y="70" font-family="Georgia, serif" font-size="64" fill="#e00000" opacity="0.25" text-anchor="middle">"</text>

  <!-- Quote text -->
  <text x="400" y="42" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="middle" fill="#e8e8e8" letter-spacing="1" opacity="0">
    Building the web, one commit at a time — clean code, creative solutions.
    <animate attributeName="opacity" values="0;0.9" dur="1.5s" fill="freeze"/>
  </text>
  <text x="400" y="65" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="300" text-anchor="middle" fill="#e00000" letter-spacing="2" opacity="0">
    — Shibil T., Full Stack Web Developer
    <animate attributeName="opacity" values="0;0.7" dur="1.5s" begin="0.5s" fill="freeze"/>
  </text>

  <!-- Pulsing bar -->
  <rect x="350" y="75" width="100" height="2" fill="#e00000" rx="1" opacity="0.5">
    <animate attributeName="width" values="0;100" dur="1s" begin="0.5s" fill="freeze"/>
    <animate attributeName="x" values="400;350" dur="1s" begin="0.5s" fill="freeze"/>
    <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" begin="1.5s" repeatCount="indefinite"/>
  </rect>
</svg>
