<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 120" width="900" height="120">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0d;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#1a0000;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0d0d0d;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="footerLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e00000;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#e00000;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#e00000;stop-opacity:0"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="120" fill="url(#footerBg)" rx="16"/>

  <!-- Grid -->
  <g stroke="#e00000" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="30" x2="900" y2="30"/>
    <line x1="0" y1="60" x2="900" y2="60"/>
    <line x1="0" y1="90" x2="900" y2="90"/>
    <line x1="225" y1="0" x2="225" y2="120"/>
    <line x1="450" y1="0" x2="450" y2="120"/>
    <line x1="675" y1="0" x2="675" y2="120"/>
  </g>

  <!-- Top accent line -->
  <rect x="0" y="0" width="900" height="2" fill="url(#footerLine)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner brackets -->
  <g stroke="#e00000" stroke-width="1.5" fill="none" stroke-opacity="0.6">
    <path d="M 20 15 L 20 35 M 20 15 L 40 15"/>
    <path d="M 880 15 L 860 15 M 880 15 L 880 35"/>
    <path d="M 20 105 L 20 85 M 20 105 L 40 105"/>
    <path d="M 880 105 L 860 105 M 880 105 L 880 85"/>
  </g>

  <!-- Wave animation at top -->
  <path d="M0,15 Q112.5,5 225,15 Q337.5,25 450,15 Q562.5,5 675,15 Q787.5,25 900,15" fill="none" stroke="#e00000" stroke-width="1" stroke-opacity="0.2">
    <animate attributeName="d" values="M0,15 Q112.5,5 225,15 Q337.5,25 450,15 Q562.5,5 675,15 Q787.5,25 900,15;M0,15 Q112.5,25 225,15 Q337.5,5 450,15 Q562.5,25 675,15 Q787.5,5 900,15;M0,15 Q112.5,5 225,15 Q337.5,25 450,15 Q562.5,5 675,15 Q787.5,25 900,15" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- Main footer text -->
  <text x="450" y="55" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#ffffff" letter-spacing="4" filter="url(#softGlow)">
    OPEN TO WORK  ·  OPEN TO COLLABORATE
  </text>
  <text x="450" y="78" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="300" text-anchor="middle" fill="#e00000" letter-spacing="2">
    shibilvpr@gmail.com  ·  github.com/shibilvpr
  </text>

  <!-- Pulsing dots row -->
  <g fill="#e00000">
    <circle cx="390" cy="98" r="2" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="415" cy="98" r="2" opacity="0.6">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="440" cy="98" r="2" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="465" cy="98" r="2" opacity="0.6">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="490" cy="98" r="2" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0.1;0.6" dur="1.5s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <circle cx="515" cy="98" r="2" opacity="0.6">
      <animate attributeName="opacity" values="0.1;0.6;0.1" dur="1.5s" begin="1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Side decorative lines -->
  <line x1="100" y1="60" x2="280" y2="60" stroke="#e00000" stroke-width="0.5" stroke-opacity="0.3"/>
  <line x1="620" y1="60" x2="800" y2="60" stroke="#e00000" stroke-width="0.5" stroke-opacity="0.3"/>
  <circle cx="280" cy="60" r="2" fill="#e00000" opacity="0.4"/>
  <circle cx="620" cy="60" r="2" fill="#e00000" opacity="0.4"/>
</svg>
