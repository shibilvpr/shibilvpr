<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d0d0d;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1a0000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d0d0d;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d0d0d;stop-opacity:0" />
      <stop offset="30%" style="stop-color:#e00000;stop-opacity:1" />
      <stop offset="70%" style="stop-color:#e00000;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d0d0d;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff4444" />
      <stop offset="50%" style="stop-color:#ffffff" />
      <stop offset="100%" style="stop-color:#ff4444" />
    </linearGradient>
    <filter id="glowRed">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glowWhite">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#e00000;stop-opacity:0.15" />
      <stop offset="100%" style="stop-color:#0d0d0d;stop-opacity:0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bgGrad)" rx="16"/>
  <rect width="900" height="200" fill="url(#centerGlow)" rx="16"/>

  <!-- Grid lines -->
  <g stroke="#e00000" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="40" x2="900" y2="40"/>
    <line x1="0" y1="80" x2="900" y2="80"/>
    <line x1="0" y1="120" x2="900" y2="120"/>
    <line x1="0" y1="160" x2="900" y2="160"/>
    <line x1="180" y1="0" x2="180" y2="200"/>
    <line x1="360" y1="0" x2="360" y2="200"/>
    <line x1="540" y1="0" x2="540" y2="200"/>
    <line x1="720" y1="0" x2="720" y2="200"/>
  </g>

  <!-- Corner Decorations -->
  <g stroke="#e00000" stroke-width="2" fill="none">
    <path d="M 20 20 L 20 50 M 20 20 L 50 20" stroke-opacity="0.7"/>
    <path d="M 880 20 L 850 20 M 880 20 L 880 50" stroke-opacity="0.7"/>
    <path d="M 20 180 L 20 150 M 20 180 L 50 180" stroke-opacity="0.7"/>
    <path d="M 880 180 L 850 180 M 880 180 L 880 150" stroke-opacity="0.7"/>
  </g>

  <!-- Pulsing dots -->
  <circle cx="60" cy="100" r="3" fill="#e00000" opacity="0.6">
    <animate attributeName="opacity" values="0.6;0.1;0.6" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="840" cy="100" r="3" fill="#e00000" opacity="0.6">
    <animate attributeName="opacity" values="0.1;0.6;0.1" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="r" values="5;3;5" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="100" cy="40" r="2" fill="#e00000" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="160" r="2" fill="#e00000" opacity="0.4">
    <animate attributeName="opacity" values="0.1;0.4;0.1" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="170" r="1.5" fill="#e00000" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.8;0.3" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="750" cy="30" r="1.5" fill="#e00000" opacity="0.3">
    <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Scanning line -->
  <rect x="0" y="0" width="900" height="2" fill="url(#lineGrad)" opacity="0.5">
    <animate attributeName="y" values="-2;202;-2" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.5;0;0.5;0" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Main Name Text -->
  <text x="450" y="95" font-family="'Segoe UI', Arial, sans-serif" font-size="44" font-weight="900" text-anchor="middle" fill="url(#textGrad)" filter="url(#glowRed)" letter-spacing="4">
    SHIBIL T.
    <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>
  </text>

  <!-- Subtitle -->
  <text x="450" y="130" font-family="'Segoe UI', Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#cccccc" letter-spacing="6" opacity="0">
    FULL STACK WEB DEVELOPER
    <animate attributeName="opacity" values="0;0.9" dur="1.5s" begin="0.5s" fill="freeze"/>
  </text>

  <!-- Sub-subtitle -->
  <text x="450" y="155" font-family="'Segoe UI', Arial, sans-serif" font-size="11" font-weight="300" text-anchor="middle" fill="#e00000" letter-spacing="3" opacity="0">
    MERN STACK  ●  REACT  ●  NODE  ●  MONGODB
    <animate attributeName="opacity" values="0;0.8" dur="1.5s" begin="1s" fill="freeze"/>
  </text>

  <!-- Horizontal accent lines -->
  <line x1="150" y1="175" x2="390" y2="175" stroke="#e00000" stroke-width="1" stroke-opacity="0.4">
    <animate attributeName="x1" values="450;150" dur="1.2s" begin="0.8s" fill="freeze"/>
    <animate attributeName="stroke-opacity" values="0;0.4" dur="1.2s" begin="0.8s" fill="freeze"/>
  </line>
  <line x1="510" y1="175" x2="750" y2="175" stroke="#e00000" stroke-width="1" stroke-opacity="0.4">
    <animate attributeName="x2" values="450;750" dur="1.2s" begin="0.8s" fill="freeze"/>
    <animate attributeName="stroke-opacity" values="0;0.4" dur="1.2s" begin="0.8s" fill="freeze"/>
  </line>
  <circle cx="450" cy="175" r="3" fill="#e00000" opacity="0.7">
    <animate attributeName="opacity" values="0;0.7" dur="0.5s" begin="1.5s" fill="freeze"/>
    <animate attributeName="r" values="3;5;3" dur="2s" begin="2s" repeatCount="indefinite"/>
  </circle>
</svg>
